components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Usuario:
      required:
        - nome
        - email
        - senha
        - data_nascimento
      type: object
      properties:
        nome:
          type: string
          example: João Cleber
          description: O número máximo de caracteres é de 45
          minLength: 4
          maxLength: 45
        email:
          type: string
          example: joao.cleber@gmail.com
          description: O número máximo de caracteres é de 255
          minLength: 15
          maxLength: 255
        senha:
          type: string
          example: jc@123
          description: O número máximo de caracteres é de 70
          minLength: 6
          maxLength: 70
        data_nascimento:
          type: string
          example: 2000-01-15
          description: O número máximo de caracteres é de 10
          minLength: 10
          maxLength: 10
        usuario_role:
          type: array
          items:
            type: object
            properties:
              id_role:
                type: integer
            example:
              id_role: 1
        doencas_cronicas:
          type: array
          items:
            type: object
            properties:
              id_doencas_cronicas:
                type: integer
            example:
              - nome_doenca: hipertensão
              - nome_doenca: diabete
        contatos_emergencias:
          type: array
          items:
            type: object
            properties:
              nome:
                type: string
              telefone:
                type: string
            example:
              - nome: ana beatriz almeida
                telefone: "11987654321"
              - nome: lucas henrique santos
                telefone: "11976543210"

    Medicamento:
      required:
        - nome
        - imagem
        - concentracao
        - frequencia
        - dosagem
        - data_hora_inicio
        - descricao
        - id_tipo_intervalo
        - id_unidade_medida_embalagem
        - id_unidade_medida_dosagem
        - id_tipo_dosagem
        - id_usuario
      type: object
      properties:
        id_usuario:
          type: integer
          example: 1
          description: aqui coloca o id do usuário que será atribuido o medicamento
        medicamento:
          type: object
          properties:
            nome:
              type: string
              description: O número máximo de caracteres é de 45
              minLength: 1
              maxLength: 45
            imagem:
              type: string
              description: O número máximo de caracteres é de 255
              minLength: 1
              maxLength: 25
            concentracao:
              type: number
              format: float
              description: O número máximo de digítos é 5
              minimum: 1
              maximum: 99999
            id_tipo_dosagem:
              type: integer
              example: 1
              description: aqui coloca o id do tipo de dosagem (comprimido, xarope, injetável)
            id_unidade_medida_embalagem:
              type: integer
              example: 1
              description: aqui coloca o id do tipo de unidade de medida (ml, g, mg, l, etc)
        receita_medica:
          type: object
          properties:
            frequencia:
              type: string
              format: time
              example: 00:01:30:00
              description: para 1 hora e 30 minutos
            dosagem:
              type: number
              format: float
              example: 2.0
              description: É válido colocar este tipo de valor para casos em que a unidade de medida suporte números floats (ml, l, g)
            data_hora_inicio:
              type: string
              format: date-time
              example: 2026-09-29T14:30:00Z
              description: para a data 29/09/2026 e horário 14:30:00
            descricao:
              type: string
              description: O número de caracteres permitido é ilimitado
            id_tipo_inervalo:
              type: integer
              example: 1
              description: aqui coloca o id do tipo de intervalo (dias ou horas)
            id_unidade_medida:
              type: integer
              example: 1
              description: aqui coloca o id do tipo de unidade de medida (ml, g, mg, l, etc)
        estoque:
          type: object
          properties:
            quantidade_em_estoque:
              type: number
              format: float
    DoencaCronica:
      required:
        - nome_doenca
      type: object
      properties:
        nome_doenca:
          type: string
          example: Hipertensão
          description: O número máximo de caracteres é de 45
          minLength: 1
          maxLength: 45

    TipoIntervalo:
      required:
        - tipo_intervalo
      type: object
      properties:
        tipo_intervalo:
          type: string
          example: Hora
          description: O número máximo de caracteres é de 5
          minLength: 1
          maxLength: 5

    Horarios:
      required:
        - horario
        - status
      type: object
      properties:
        horario:
          type: string
          example: 2026-09-24 08:00:00
          description: Registra data e hora
        status:
          type: string
          example: Pendente
          description: O número máximo de caracteres é de 10
          minLength: 1
          maxLength: 10

    TipoDosagem:
      required:
        - tipo_dosagem
      type: object
      properties:
        tipo_dosagem:
          type: string
          example: Comprimido
          description: O número máximo de caracteres é de 12
          minLength: 1
          maxLength: 12

    UnidadeMedida:
      required:
        - unidade_medida
        - sigla
      type: object
      properties:
        unidade_medida:
          type: string
          example: Miligrama
          description: O número máximo de caracteres é de 30
          minLength: 1
